name: CI

# Vercel deploys automatically via its Git integration (production on `main`,
# preview on PRs). This workflow only validates that the app lints and builds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_* are inlined at build time; safe placeholders for CI.
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_R2_PUBLIC_URL: http://localhost
          API_PROXY_TARGET: http://localhost:8000
